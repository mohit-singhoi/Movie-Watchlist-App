<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Movie Watchlist</title>


    <!-- =====================================================
         BOOTSTRAP 4.1.3
         ===================================================== -->

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">


    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         ADMIN LOGIN CSS
         ===================================================== -->

    <style>

        /* =====================================================
           GLOBAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            font-family: 'Poppins', sans-serif;

            background:
                linear-gradient(
                    rgba(40, 0, 5, 0.80),
                    rgba(40, 0, 5, 0.80)
                ),
                url('/Images/movie-bg.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            color: #292d32;
        }


        /* =====================================================
           MAIN WRAPPER
           ===================================================== */

        .admin-login-wrapper {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;
        }


        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .admin-login-container {

            width: 100%;

            max-width: 450px;

            background: rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.40);

            text-align: center;
        }


        /* =====================================================
           ADMIN ICON
           ===================================================== */

        .admin-icon {

            width: 78px;

            height: 78px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #fff3cd;

            border-radius: 50%;

            font-size: 38px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .admin-login-container h1 {

            margin: 0 0 8px;

            font-size: 28px;

            font-weight: 700;

            color: #252a2f;
        }


        .admin-subtitle {

            margin: 0 0 30px;

            font-size: 13px;

            line-height: 1.6;

            color: #777;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #444;
        }


        .form-control {

            height: 46px;

            border: 1px solid #dddddd;

            border-radius: 8px;

            padding: 10px 13px;

            font-family: 'Poppins', sans-serif;

            font-size: 13px;

            box-shadow: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-control:focus {

            border-color: #343a40;

            box-shadow:
                0 0 0 3px rgba(52, 58, 64, 0.10);
        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .admin-login-btn {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 12px 18px;

            background: #343a40;

            color: #ffffff;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .admin-login-btn:hover {

            background: #202428;

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.18);
        }


        /* =====================================================
           ERROR MESSAGE
           ===================================================== */

        .login-error {

            margin-bottom: 20px;

            padding: 10px 12px;

            border-radius: 7px;

            background: #f8d7da;

            color: #721c24;

            font-size: 12px;

            text-align: left;
        }


        /* =====================================================
           LOGOUT / SUCCESS MESSAGE
           ===================================================== */

        .login-message {

            margin-bottom: 20px;

            padding: 10px 12px;

            border-radius: 7px;

            background: #d4edda;

            color: #155724;

            font-size: 12px;

            text-align: left;
        }


        /* =====================================================
           BACK TO LOGIN
           ===================================================== */

        .back-login {

            display: inline-block;

            margin-top: 22px;

            color: #e63946 !important;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none !important;
        }


        .back-login:hover {

            text-decoration: underline !important;
        }


        /* =====================================================
           SECURITY MESSAGE
           ===================================================== */

        .security-message {

            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #eeeeee;

            color: #999;

            font-size: 11px;

            line-height: 1.6;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

		   .auth-footer {
		       text-align: center;
		       color: #ffffff;
		       font-size: 13px;
		       padding: 20px 10px;
		       margin-top: 20px;
		   }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .admin-login-wrapper {

                padding: 30px 15px;
            }

            .admin-login-container {

                padding: 30px 22px;

                border-radius: 17px;
            }

            .admin-login-container h1 {

                font-size: 24px;
            }

            .admin-subtitle {

                font-size: 12px;
            }

            .admin-icon {

                width: 68px;

                height: 68px;

                font-size: 32px;
            }

        }


        /* =====================================================
           VERY SMALL MOBILE
           ===================================================== */

        @media (max-width: 400px) {

            .admin-login-container {

                padding: 25px 17px;
            }

            .admin-login-container h1 {

                font-size: 22px;
            }

            .form-control {

                height: 44px;
            }

        }

    </style>

</head>


<body>



<!-- =====================================================
     ADMIN LOGIN
     ===================================================== -->

<main class="admin-login-wrapper">

    <div class="admin-login-container">


        <!-- ADMIN ICON -->

        <div class="admin-icon">
            👑
        </div>


        <!-- TITLE -->

        <h1>
            Admin Login
        </h1>


        <p class="admin-subtitle">
            Sign in to access the Movie Watchlist
            administration panel.
        </p>


        <!-- =================================================
             LOGIN ERROR
             ================================================= -->

			 <!-- Error Message -->
			 <div class="login-error"
			      th:if="${param.error != null and param.logout == null}">

			     ❌ Invalid admin email or password.

			 </div>


			 <!-- Logout Message -->
			 <div class="login-message"
			      th:if="${param.logout != null and param.error == null}">

			     ✅ You have been successfully logged out.

			 </div>


        <!-- =================================================
             ADMIN LOGIN FORM
             ================================================= -->

        <form th:action="@{/adminlogin}"
              method="post">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter admin email"
                       autocomplete="username"
                       required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter admin password"
                       autocomplete="current-password"
                       required>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit"
                    class="admin-login-btn">

                👑 Login as Admin

            </button>

        </form>


        <!-- =================================================
             BACK TO LOGIN SELECTION
             ================================================= -->

        <a href="/login"
           class="back-login">

            ← Back to Login Selection

        </a>


        <!-- =================================================
             SECURITY MESSAGE
             ================================================= -->

        <div class="security-message">

            🔒 This area is restricted to authorized
            administrators only.

        </div>

    </div>

</main>


<!-- =====================================================
     FOOTER
     ================================================= -->

	 <footer class="auth-footer">
	     <p>
	         © 2026 Movie Watchlist App. All Rights Reserved.
	     </p>
	 </footer>


</body>

</html>
