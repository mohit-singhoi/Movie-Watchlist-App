<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>User Login | Movie Watchlist</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <style>

        body {
            background:
                linear-gradient(rgba(0,0,0,.60), rgba(0,0,0,.60)),
                url('/Images/movie-bg.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;
        }

        .container-box {
            max-width: 500px;
            margin: 60px auto;

            background: rgba(255,255,255,.92);
            backdrop-filter: blur(10px);

            border-radius: 20px;
            padding: 40px;

            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        h2 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            border-radius: 10px;
            padding: 12px;

            font-weight: bold;
            font-size: 17px;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            font-weight: bold;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            text-decoration: none;
        }

        .login-selection {
            text-align: center;
            margin-top: 18px;
        }

        .login-selection a {
            font-weight: bold;
            color: #dc3545;
            text-decoration: none;
        }

        .login-selection a:hover {
            text-decoration: underline;
        }
		
		.auth-footer {
		    text-align: center;
		    color: #ffffff;
		    font-size: 13px;
		    padding: 20px 10px;
		    margin-top: 20px;
		}

    </style>

</head>

<body>

<div class="container-box">

    <h2>🎬 Welcome Back</h2>

    <p class="subtitle">
        Login to manage your personal movie watchlist.
    </p>


    <!-- Login Form -->

    <form th:action="@{/login}" method="post">

        <div class="form-group">

            <label>Email Address</label>

            <input type="email"
                   name="username"
                   class="form-control"
                   placeholder="Enter your email"
                   required>

        </div>


        <div class="form-group">

            <label>Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>

        </div>


        <div class="form-group form-check">

            <input type="checkbox"
                   class="form-check-input"
                   id="remember">

            <label class="form-check-label"
                   for="remember">

                Remember Me

            </label>

        </div>


        <button type="submit"
                class="btn btn-danger btn-login">

            🔐 Login

        </button>

    </form>


    <!-- Signup -->

    <div class="signup-link">

        Don't have an account?

        <a href="/signup">

            Create Account

        </a>

    </div>


    <!-- Back to Login Selection -->

    <div class="login-selection">

        <a href="/login">

            ← Back to Login Selection

        </a>

    </div>


    <!-- Back Home -->

    <div class="back-home">

        <a href="/">

            ← Back to Home

        </a>

    </div>

</div>

<footer class="auth-footer">
    <p>
        © 2026 Movie Watchlist App. All Rights Reserved.
    </p>
</footer>

</body>

</html>
