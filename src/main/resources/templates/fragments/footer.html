	<div th:fragment="footer">

	        .site-footer {
	            margin-top: 50px;
	            padding: 30px 20px;
	            text-align: center;
	            color: white;
	            background: rgba(20, 20, 20, 0.85);
	            backdrop-filter: blur(10px);
	            border-radius: 15px;
	        }

	        .site-footer h5 {
	            font-weight: bold;
	            margin-bottom: 15px;
	        }

	        .site-footer p {
	            color: #ddd;

			.quick-links {
			    margin: 25px 0;
			}

			.quick-links h5 {
			    margin-bottom: 15px;
			    font-weight: bold;
			}

			.quick-link-list {
			    display: flex;
			    justify-content: center;
			    align-items: center;
			    flex-wrap: wrap;
			    gap: 12px;
			}

			.quick-link-list a {
			    color: #ddd;
			    text-decoration: none;
			    padding: 8px 14px;
			    border-radius: 8px;
			    transition: 0.3s;
			    font-size: 15px;
			}

			.quick-link-list a:hover {
			    background: rgba(255,255,255,0.12);
			    color: white;
			    transform: translateY(-2px);
			    text-decoration: none;
			}

	        .footer-buttons {
	            display: flex;
	            justify-content: center;
	            align-items: center;
	            flex-wrap: wrap;
	            gap: 10px;
	            margin-bottom: 20px;
	        }

	        .site-footer .footer-btn {
	            min-width: 110px;
	            padding: 8px 18px;
	            border-radius: 8px;
	            font-size: 14px;
	            font-weight: 600;
	            text-decoration: none;
	        }

	        .site-footer .footer-btn:hover {
	            opacity: 0.9;
	            text-decoration: none;
	        }

	        .site-footer small {
	            color: #bbb;
	        }
	    </style>
