<!DOCTYPE html>
<nav xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

<style>

.navbar{
    background:rgba(108,117,125,.95) !important;
    backdrop-filter:blur(12px);
    border-radius:15px;
    padding:12px 20px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.navbar-brand{
    font-size:26px;
    font-weight:700;
    color:#fff !important;
}

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: nowrap;
    white-space: nowrap;
    padding: 10px 20px;
    overflow-x: auto;
}

.navbar a,
.navbar span,
.navbar button {
    white-space: nowrap;
    flex-shrink: 0;
}

.navbar-brand:hover{
    color:#ffc107 !important;
}

.navbar-nav .nav-link{
    color:#f8f9fa !important;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.navbar-nav .nav-link:hover{
    color:#ffc107 !important;
    background:rgba(255,255,255,.12);
    border-radius:6px;
}

.nav-item.active .nav-link{
    background:#dc3545;
    color:#fff !important;
    border-radius:6px;
}

.navbar-brand {
    white-space: nowrap;
}

.navbar .nav-link {
    white-space: nowrap;
    word-break: normal;
}

.navbar .nav-item {
    white-space: nowrap;
}

/* Login Button */

.login-btn{
    border:2px solid #fff;
    color:#fff !important;
    border-radius:8px;
    padding:7px 18px;
    font-weight:600;
    transition:.3s;
}

.login-btn:hover{
    background:#fff;
    color:#343a40 !important;
}

/* Signup Button */

.signup-btn{
    border-radius:8px;
    padding:8px 20px;
    font-weight:600;
    transition:.3s;
}

.signup-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(220,53,69,.35);
}

.navbar-toggler{
    border:none;
}

.navbar-toggler:focus{
    box-shadow:none;
}

@media(max-width:991px){

    .login-btn,
    .signup-btn{
        width:100%;
        margin-top:10px;
    }

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-secondary"
     th:fragment="navbar">

	 <a class="navbar-brand" href="/">
	     🎬 Watchlist App
	 </a>
	 


	 <button class="navbar-toggler"
	         type="button"
	         data-toggle="collapse"
	         data-target="#navbarSupportedContent">

	     <span class="navbar-toggler-icon"></span>

	 </button>
	 
	 

	 

	 <div class="collapse navbar-collapse"
	      id="navbarSupportedContent">

	     <!-- Left Side -->
	     <ul class="navbar-nav mr-auto">

	         <!-- Home - Everyone -->
	         <li class="nav-item">
	             <a class="nav-link" href="/">
	                 🏠 Home
	             </a>
	         </li>

	         <!-- Watchlist - Visible to everyone
	              Security will redirect anonymous users to login -->
	         <li class="nav-item">
	             <a class="nav-link" href="/watchlist">
	                 🎬 Watchlist
	             </a>
	         </li>

	         <!-- Add Movie - Visible to everyone
	              Security will redirect anonymous users to login -->
	         <li class="nav-item">
	             <a class="nav-link" href="/watchlistItemForm">
	                 ➕ Add Movie
	             </a>
	         </li>

	         <!-- About - Everyone -->
	         <li class="nav-item">
	             <a class="nav-link" href="/about">
	                 ℹ️ About
	             </a>
	         </li>

	         <!-- Contact - Everyone -->
	         <li class="nav-item">
	             <a class="nav-link" href="/contact">
	                 📞 Contact Us
	             </a>
	         </li>

	         <!-- Feedback - ONLY logged-in users -->
	         <li class="nav-item" sec:authorize="isAuthenticated()">
	             <a class="nav-link" href="/feedback">
	                 💬 Feedback
	             </a>
	         </li>

	     </ul>


	     <!-- Right Side -->
	     <div class="d-flex align-items-center">

	         <!-- NOT LOGGED IN -->
	         <div sec:authorize="isAnonymous()">

	             <a href="/login"
	                class="btn btn-outline-light mr-2">
	                 🔐 Login
	             </a>

	             <a href="/signup"
	                class="btn btn-danger">
	                 🚀 Sign Up
	             </a>

	         </div>


	         <!-- LOGGED IN -->
	         <div sec:authorize="isAuthenticated()"
	              class="d-flex align-items-center">

				  
				  <span class="text-white mr-3"
				        th:if="${#authentication.authenticated}">
				      👋 Hii,
				      <strong th:text="${#strings.substringBefore(#authentication.principal.user.fullName, ' ')}">
				          User
				      </strong>
				  </span>
				  

	             <form th:action="@{/logout}" method="post">

	                 <button type="submit"
	                         class="btn btn-warning">
	                     🚪 Logout
	                 </button>

	             </form>

	         </div>

	     </div>

	 </div>
	
	

</nav>


</body>

</nav>
