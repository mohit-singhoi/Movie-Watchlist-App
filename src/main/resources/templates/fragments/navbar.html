<!DOCTYPE html>

<nav class="wl-navbar"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:fragment="navbar">

    <!-- =====================================================
         BRAND
         ===================================================== -->

    <a href="/" class="wl-brand">
        🎬 Watchlist App
    </a>


    <!-- =====================================================
         MOBILE 3-LINE BUTTON
         ===================================================== -->

    <button type="button"
            id="wlMobileButton"
            class="wl-mobile-button"
            aria-label="Toggle navigation"
            aria-expanded="false">

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- =====================================================
         NAVBAR CONTENT
         ===================================================== -->

    <div id="wlNavbarContent"
         class="wl-navbar-content">


        <!-- =================================================
             LEFT NAVIGATION
             ================================================= -->

        <div class="wl-navbar-links">

            <a href="/"
               class="wl-nav-link">
                🏠 Home
            </a>

            <a href="/watchlist"
               class="wl-nav-link">
                🎬 Watchlist
            </a>

            <a href="/watchlistItemForm"
               class="wl-nav-link">
                ➕ Add Movie
            </a>

            <a href="/about"
               class="wl-nav-link">
                ℹ️ About
            </a>

            <a href="/contact"
               class="wl-nav-link">
                📞 Contact Us
            </a>

            <!-- Only logged-in users -->
            <a sec:authorize="isAuthenticated()"
               href="/feedback"
               class="wl-nav-link">
                💬 Feedback
            </a>

        </div>


        <!-- =================================================
             RIGHT SIDE
             ================================================= -->

        <div class="wl-navbar-user">


            <!-- =================================================
                 NOT LOGGED IN
                 ================================================= -->

            <div sec:authorize="isAnonymous()"
                 class="wl-auth-buttons">

                <a href="/login"
                   class="wl-login-btn">
                    🔐 Login
                </a>

                <a href="/signup"
                   class="wl-signup-btn">
                    🚀 Sign Up
                </a>

            </div>


            <!-- =================================================
                 LOGGED IN
                 ================================================= -->

            <div sec:authorize="isAuthenticated()"
                 class="wl-user-dropdown">


                <!-- USER BUTTON -->

                <button type="button"
                        id="wlUserButton"
                        class="wl-user-button"
                        aria-expanded="false">

                    👋 Hello&nbsp;
                    <span th:text="${#strings.substringBefore(
                        #authentication.principal.user.fullName,
                        ' '
                    )}">
                        User
                    </span>
                    ▼

                </button>


                <!-- USER DROPDOWN -->

                <div id="wlUserMenu"
                     class="wl-user-menu">

                    <a href="/dashboard">
                        📊 Dashboard
                    </a>

                    <div class="wl-dropdown-divider"></div>

                    <form th:action="@{/logout}"
                          method="post">

                        <button type="submit">
                            🚪 Logout
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         NAVBAR CSS
         ===================================================== -->

    <style>

        /* =====================================================
           MAIN NAVBAR
           ===================================================== */

        .wl-navbar {
            width: 100%;
            min-height: 70px;
			background: #6c757d;

            display: flex;
            align-items: center;

            padding: 0 20px;

            box-sizing: border-box;

            background: #6c757d;

            position: relative;
            z-index: 1000;
			
			margin:0;

            font-family: Arial, sans-serif;
        }


        /* =====================================================
           BRAND
           ===================================================== */

        .wl-brand {
            display: inline-flex;
            align-items: center;

            flex-shrink: 0;

            margin-right: 22px;

            color: #ffffff !important;

            font-size: 24px;
            font-weight: 700;

            line-height: 1;

            white-space: nowrap;

            text-decoration: none !important;
        }


        .wl-brand:hover {
            color: #ffffff !important;
            text-decoration: none !important;
        }


        /* =====================================================
           NAVBAR CONTENT
           ===================================================== */

        .wl-navbar-content {
            flex: 1;

            min-width: 0;

            display: flex;
            align-items: center;

            justify-content: space-between;
        }


        /* =====================================================
           LEFT LINKS
           ===================================================== */

        .wl-navbar-links {
            display: flex;
            align-items: center;

            gap: 2px;

            min-width: 0;

            white-space: nowrap;
        }


        .wl-nav-link {
            display: inline-flex;
            align-items: center;

            padding: 9px 8px;

            color: #ffffff !important;

            font-size: 15px;
            font-weight: 500;

            line-height: 1.4;

            white-space: nowrap;

            border-radius: 6px;

            text-decoration: none !important;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .wl-nav-link:hover {
            color: #ffffff !important;

            background: rgba(255, 255, 255, 0.15);

            text-decoration: none !important;
        }


        /* =====================================================
           RIGHT SIDE
           ===================================================== */

        .wl-navbar-user {
            display: flex;
            align-items: center;

            flex-shrink: 0;

            margin-left: 12px;
        }


        /* =====================================================
           LOGIN / SIGNUP
           ===================================================== */

        .wl-auth-buttons {
            display: flex;
            align-items: center;

            gap: 8px;

            white-space: nowrap;
        }


        .wl-login-btn,
        .wl-signup-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 42px;

            padding: 0 13px;

            box-sizing: border-box;

            border-radius: 7px;

            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;

            text-decoration: none !important;
        }


        /* Login */

        .wl-login-btn {
            color: #ffffff !important;

            background: transparent;

            border: 1px solid rgba(255,255,255,0.8);
        }


        .wl-login-btn:hover {
            color: #ffffff !important;

            background: rgba(255,255,255,0.15);

            text-decoration: none !important;
        }


        /* Signup */

        .wl-signup-btn {
            color: #ffffff !important;

            background: #dc3545;

            border: 1px solid #dc3545;
        }


        .wl-signup-btn:hover {
            color: #ffffff !important;

            background: #c82333;

            border-color: #c82333;

            text-decoration: none !important;
        }


        /* =====================================================
           USER DROPDOWN
           ===================================================== */

        .wl-user-dropdown {
            position: relative;

            flex-shrink: 0;
        }


        .wl-user-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 42px;

            padding: 0 13px;

            border-radius: 7px;

            border: 1px solid rgba(255,255,255,0.8);

            background: transparent;

            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;

            cursor: pointer;

            outline: none;
        }


        .wl-user-button:hover,
        .wl-user-button:focus {
            color: #ffffff;

            background: rgba(255,255,255,0.15);

            outline: none;
        }


        /* =====================================================
           DROPDOWN MENU
           ===================================================== */

        .wl-user-menu {
            display: none;

            position: absolute;

            top: calc(100% + 8px);

            right: 0;

            width: 190px;

            padding: 6px 0;

            background: #ffffff;

            border-radius: 8px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);

            overflow: hidden;

            z-index: 10000;
        }


        .wl-user-menu.wl-open {
            display: block;
        }


        .wl-user-menu a,
        .wl-user-menu button {
            display: block;

            width: 100%;

            padding: 11px 16px;

            box-sizing: border-box;

            border: none;

            background: #ffffff;

            color: #333333 !important;

            font-size: 15px;

            text-align: left;

            text-decoration: none !important;

            cursor: pointer;
        }


        .wl-user-menu a:hover,
        .wl-user-menu button:hover {
            background: #f1f1f1;

            color: #222222 !important;

            text-decoration: none !important;
        }


        .wl-user-menu form {
            margin: 0;
            padding: 0;
        }


        .wl-dropdown-divider {
            height: 1px;

            margin: 5px 0;

            background: #eeeeee;
        }


        /* =====================================================
           MOBILE BUTTON
           ===================================================== */

        .wl-mobile-button {
            display: none;

            flex-shrink: 0;

            width: 42px;
            height: 40px;

            margin-left: auto;

            padding: 6px;

            border: 1px solid rgba(255,255,255,0.8);

            border-radius: 6px;

            background: transparent;

            cursor: pointer;

            outline: none;
        }


        .wl-mobile-button:hover {
            background: rgba(255,255,255,0.15);
        }


        .wl-mobile-button span {
            display: block;

            width: 100%;
            height: 3px;

            margin: 4px 0;

            border-radius: 2px;

            background: #ffffff;
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 1150px) {

            .wl-navbar {
                padding: 0 15px;
            }


            .wl-brand {
                font-size: 21px;

                margin-right: 12px;
            }


            .wl-nav-link {
                font-size: 14px;

                padding: 8px 5px;
            }


            .wl-login-btn,
            .wl-signup-btn,
            .wl-user-button {
                font-size: 13px;

                padding: 0 9px;
            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 850px) {

            .wl-navbar {
                min-height: 62px;

                padding: 0 14px;

                flex-wrap: wrap;
				margin-top: 10px;
            }


            /* Brand */

            .wl-brand {
                font-size: 20px;
				margin-top: 8px;

                margin-right:0px;
				box-sizing: border-box;
				display: block;
				
            }


            /* Show hamburger */

            .wl-mobile-button {
                display: block;
				margin-top: 8px;
				box-sizing: border-box;
				border-radius: 2px solid black;
            }


            /* Hide content initially */

            .wl-navbar-content {
                display: none;

                flex: none;

                width: 100%;

                flex-direction: column;

                align-items: stretch;

                padding: 10px 0;
            }


            /* Open mobile menu */

            .wl-navbar-content.wl-mobile-open {
                display: flex;
            }


            /* Mobile navigation */

            .wl-navbar-links {
                width: 100%;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                gap: 2px;
            }


            .wl-nav-link {
                width: 100%;

                padding: 11px 10px;

                box-sizing: border-box;

                font-size: 15px;
            }


            /* Mobile user area */

            .wl-navbar-user {
                width: 100%;

                margin: 10px 0 0;

                padding-top: 10px;

                border-top:
                    1px solid rgba(255,255,255,0.25);
            }


            /* Login/signup */

            .wl-auth-buttons {
                width: 100%;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                gap: 7px;
            }


            .wl-login-btn,
            .wl-signup-btn {
                width: 100%;

                height: 42px;

                font-size: 14px;
            }


            /* Logged-in user */

            .wl-user-dropdown {
                width: 100%;
            }


            .wl-user-button {
                width: 100%;

                height: 42px;
            }


            /* Mobile dropdown */

            .wl-user-menu {
                position: static;

                width: 100%;

                margin-top: 7px;

                box-shadow: none;

                border-radius: 7px;
            }

        }


        /* =====================================================
           SMALL MOBILE
           ===================================================== */

        @media (max-width: 400px) {

            .wl-navbar {
                padding: 0 10px;
            }


            .wl-brand {
                font-size: 18px;
            }


            .wl-mobile-button {
                width: 40px;
                height: 38px;
            }

        }

    </style>


    <!-- =====================================================
         NAVBAR JAVASCRIPT
         ===================================================== -->

    <script>

        (function () {

            const mobileButton =
                document.getElementById("wlMobileButton");

            const navbarContent =
                document.getElementById("wlNavbarContent");

            const userButton =
                document.getElementById("wlUserButton");

            const userMenu =
                document.getElementById("wlUserMenu");


            /* =================================================
               MOBILE MENU
               ================================================= */

            if (mobileButton && navbarContent) {

                mobileButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();
                        event.stopPropagation();

                        const isOpen =
                            navbarContent.classList.toggle(
                                "wl-mobile-open"
                            );

                        mobileButton.setAttribute(
                            "aria-expanded",
                            isOpen ? "true" : "false"
                        );

                    }
                );

            }


            /* =================================================
               USER DROPDOWN
               ================================================= */

            if (userButton && userMenu) {

                userButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();
                        event.stopPropagation();

                        const isOpen =
                            userMenu.classList.toggle(
                                "wl-open"
                            );

                        userButton.setAttribute(
                            "aria-expanded",
                            isOpen ? "true" : "false"
                        );

                    }
                );


                /* Close user dropdown outside */

                document.addEventListener(
                    "click",
                    function (event) {

                        if (
                            !userMenu.contains(event.target) &&
                            !userButton.contains(event.target)
                        ) {

                            userMenu.classList.remove(
                                "wl-open"
                            );

                            userButton.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }

                    }
                );

            }


            /* =================================================
               CLOSE MOBILE MENU AFTER LINK CLICK
               ================================================= */

            if (navbarContent) {

                const navLinks =
                    navbarContent.querySelectorAll(
                        ".wl-nav-link"
                    );


                navLinks.forEach(function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            navbarContent.classList.remove(
                                "wl-mobile-open"
                            );

                            if (mobileButton) {

                                mobileButton.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );

                            }

                        }
                    );

                });

            }


            /* =================================================
               CLOSE MENU ON DESKTOP RESIZE
               ================================================= */

            window.addEventListener(
                "resize",
                function () {

                    if (window.innerWidth > 850) {

                        if (navbarContent) {

                            navbarContent.classList.remove(
                                "wl-mobile-open"
                            );

                        }

                        if (mobileButton) {

                            mobileButton.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }

                    }

                }
            );

        })();

    </script>

</nav>
