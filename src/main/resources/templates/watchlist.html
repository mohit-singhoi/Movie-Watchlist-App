<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
	
		  <style>	  
		  
			.table th,
			.table td{
			    white-space:nowrap;
			    vertical-align:middle;
			}
		  
		  .table td:nth-child(5){
		      white-space: normal;
		      min-width:250px;
		  }
		  
		  .table td:first-child,
		  .table th:first-child{
		      min-width:180px;
		  }
		  
		  

		  a{
		      text-decoration:none;
		  }
		  
		  .table-responsive{
		      overflow-x:auto;
		      -webkit-overflow-scrolling:touch;
		  }

		  .table{
		      min-width:1100px;
		      background:white;
			  border-radius:10px;
		  }

		  /* Heading shadow */
		  h2 {
		      text-shadow: 2px 2px 5px gray;
		      font-weight: bold;
		  }

		  /* Table shadow */
		  .table-box{
		      overflow-x:auto;
		      overflow-y:hidden;
		      box-shadow:0 4px 15px rgba(0,0,0,.2);
		      border-radius:8px;
		      background:#fff;
		  }


		  /* Delete button */
		  .btn-danger {
		      background-color: #dc3545;
		      border-color: #dc3545;
		  }
		  
		  body{
		      background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
		                  url('/Images/movie-bg.jpg');
		      background-size: cover;
		      background-position: center;
		      background-attachment: fixed;
		  }
		  
		  .container{
		      background: rgba(255,255,255,0.90);
		      backdrop-filter: blur(10px);
		      border-radius:20px;
		      padding:30px;
		      margin-top:30px;
		      box-shadow:0 15px 40px rgba(0,0,0,.35);
		  }
		  
		  
		  footer{
		      margin-top: 60px;
		      padding: 20px;
		      text-align: center;
		      color: white;
		      font-size: 15px;
		      background: rgba(255,255,255,0.08);
		      backdrop-filter: blur(10px);
		      border-radius: 12px;
		  }
		  

		  </style>

		 

    <title>Watchlist | Movie Watchlist</title>
</head>

<body>

<div class="container">

    <!-- Navbar -->
	<!------Creating a reusable navbar fragment is exactly how Thymeleaf projects are typically organized.------->

	<div th:replace="~{fragments/navbar :: navbar}"></div>
	
    <!-- Heading -->
    <h2 class="mt-4">Watchlist</h2>
	
	<div
	th:if="${!#lists.isEmpty(watchlistrows)}"
	class="d-flex justify-content-between align-items-center mb-3">
	    <h5 class="mb-0">My Movies</h5>

	    <a href="/watchlistItemForm"
	       class="btn btn-success">
	        ➕ Add Movie
	    </a>
	</div>
	
		
		<!-- Empty Watchlist -->
		<div th:if="${#lists.isEmpty(watchlistrows)}"
		     class="text-center p-5 table-box">

		    <div style="font-size:70px;">🎬</div>

		    <h3>No movies in your watchlist</h3>

		    <p class="text-muted">Add your first movie.</p>

		    <a href="/watchlistItemForm"
		       class="btn btn-primary btn-lg">
		        ➕ Add Movie
		    </a>

		</div>
		
		
		 <!-- ========================= -->
		 <!-- Movie Table -->
		 <!-- ========================= -->

		 <div th:if="${!#lists.isEmpty(watchlistrows)}"
		      class="table-box table-responsive">

		     <table class="table table-hover align-middle">
				
				<thead class="thead-light">
				 <tr>
				     <th class="text-left">Title</th>
				     <th class="text-left">Rating</th>
					<th class="text-left">Source</th>
				     <th class="text-left">Priority</th>
				     <th class="text-left">Comment</th>
				     <th class="text-left"></th>
					<th class="text-left"></th>
				 </tr>
				 </thead>
				 

		         <tbody>

		         <tr th:each="movie : ${watchlistrows}">

		             <td th:text="${movie.title}">
		                 Avatar
		             </td>

		             <td th:text="${movie.rating}">
		                 8.5
		             </td>

		             <td>
		                 <a th:href="${movie.source}"
		                    target="_blank">
		                     🎬 Watch
		                 </a>
		             </td>

		             <td th:text="${movie.priority}">
		                 HIGH
		             </td>

		             <td th:text="${movie.comment}">
		                 Great Movie
		             </td>

		             <td>
		                 <a class="btn btn-info btn-sm"
		                    th:href="@{/watchlistItemForm(id=${movie.id})}">
		                     ✏ Update
		                 </a>
		             </td>

		             <td>
		                 <a class="btn btn-danger btn-sm"
		                    th:href="@{/delete(id=${movie.id})}">
		                     🗑 Delete
		                 </a>
		             </td>

		         </tr>

		         </tbody>

		     </table>

		 </div>

    <hr>

	<div>
	    Number of movies to watch:
	    <span th:text="${noofmovies}"></span>
	</div>

</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>


<hr>
<hr>

<div th:replace="~{fragments/footer :: footer}"></div>


</body>


</html>
